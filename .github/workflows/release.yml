name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ZIP smartrent Dir
        run: |
          cd ${{ github.workspace }}/custom_components/smartrent
          zip smartrent.zip -r ./

      - name: Create Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          generate_release_notes: true
          files: ${{ github.workspace }}/custom_components/smartrent/smartrent.zip
